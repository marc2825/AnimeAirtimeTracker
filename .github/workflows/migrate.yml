# The only workflow that applies Prisma migrations to the production database (ingest.yml only
# checks that none are pending). On push it runs only when the repository variable MIGRATE_ON_PUSH
# is "true"; a manual run (workflow_dispatch) is itself the opt-in. Needs the secret
# DIRECT_DATABASE_URL (owner role, non-pooled). Keep migrations additive
# (expand → deploy code → contract) because Vercel deploys the app in parallel.
# When the repository variable WEB_DB_ROLE names the web's database role, its privileges are brought back to
# src/server/web-role.ts after every migration (idempotent) and audited, so a new table is never readable by the
# web unless that file lists it. Unset: the role is left alone.
name: Migrate

on:
  push:
    branches: [main]
    paths: ["prisma/migrations/**", "prisma/schema.prisma", "src/server/web-role.ts"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || vars.MIGRATE_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    # The owner connection string lives in this environment, which only main can use; until it is set there,
    # the repository secret of the same name is used.
    environment: production
    timeout-minutes: 10
    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      # Logs of a public repository are public; see ingest.yml.
      - name: Mask database host
        run: node -e 'try { const h = new URL(process.env.DIRECT_DATABASE_URL).hostname; console.log(`::add-mask::${h}`); console.log(`::add-mask::${h.split(".")[0]}`); } catch {}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - name: Limit the web role to the site's tables
        if: vars.WEB_DB_ROLE != ''
        env:
          WEB_DB_ROLE: ${{ vars.WEB_DB_ROLE }}
        run: npm run db:role -- apply --yes
