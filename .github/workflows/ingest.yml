# Scheduled ingestion from Syoboi Calendar into the production database.
# Runs only when the repository variable INGEST_ENABLED is "true" and the secrets
# DIRECT_DATABASE_URL (owner role, NON-pooled: the ingest lock is session-scoped) and
# SYOBOI_USER_AGENT are configured. See docs/operations.md#scheduled-ingestion.
name: Ingest

on:
  schedule:
    # Off the hour on purpose (source rules ask clients not to cluster on :00).
    - cron: "23 */6 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "ingest command"
        required: true
        default: update
        type: choice
        options: [update, recent, season, backfill, derive, channels, subtitles]
      from:
        description: "backfill: first season (e.g. 2024-winter)"
        required: false
        default: ""
      to:
        description: "backfill: last season (e.g. 2026-summer)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      SYOBOI_USER_AGENT: ${{ secrets.SYOBOI_USER_AGENT }}
      SYOBOI_MIN_INTERVAL_MS: "3000"
      # Titles per run for the subtitle backfill. Unset = default (500); set the repository variable to 0 to pause.
      SUBTITLE_BACKFILL_PER_RUN: ${{ vars.SUBTITLE_BACKFILL_PER_RUN }}
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_FROM: ${{ inputs.from }}
      INPUT_TO: ${{ inputs.to }}
    steps:
      # Logs of a public repository are public. The URL is a masked secret, but its host is not and
      # the Prisma CLI prints it; mask the host and the endpoint id for all later steps.
      - name: Mask database host
        run: node -e 'try { const h = new URL(process.env.DIRECT_DATABASE_URL).hostname; console.log(`::add-mask::${h}`); console.log(`::add-mask::${h.split(".")[0]}`); } catch {}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migrations are applied only by migrate.yml (MIGRATE_ON_PUSH or a manual run). Exits non-zero while
      # migrations are pending, so ingestion never writes into an outdated schema.
      - name: Check database schema is up to date
        run: npx prisma migrate status
      - name: Random delay (spread load)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 240))
      - name: Run ingest
        # Inputs arrive via env and are validated, never interpolated into the script.
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then CMD="$INPUT_COMMAND";
          elif [ "$SCHEDULE" = "41 19 * * *" ]; then CMD="recent";
          else CMD="update"; fi
          case "$CMD" in update|recent|season|derive|channels|subtitles) npm run ingest -- "$CMD" ;;
            backfill)
              for s in "$INPUT_FROM" "$INPUT_TO"; do
                echo "$s" | grep -Eq '^[0-9]{4}-(winter|spring|summer|autumn)$' || { echo "invalid season: $s"; exit 1; }
              done
              npm run ingest -- backfill --from "$INPUT_FROM" --to "$INPUT_TO" ;;
            *) echo "unknown command"; exit 1 ;;
          esac
