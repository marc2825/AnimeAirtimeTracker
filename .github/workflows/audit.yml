# Dependency audit from the lockfile: known vulnerabilities in direct and indirect dependencies, and registry
# signatures of what was installed. Packages that Next.js bundles under next/dist/compiled are not in the lockfile;
# they are covered by Next.js's own advisories, so keeping `next` current (Dependabot) is part of this check.
name: Audit

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, away from the ingest schedule
  pull_request:
    paths: ["package.json", "package-lock.json", ".github/workflows/audit.yml"]
  push:
    branches: [main]
    paths: ["package.json", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Dev dependencies included: the ingest, migration and backup jobs run dev tooling with production secrets.
      - name: Known vulnerabilities (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Registry signatures and attestations
        run: npm audit signatures
