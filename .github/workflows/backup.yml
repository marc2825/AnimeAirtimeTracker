# Monthly database backup kept outside Neon (Neon Free only restores the last 6 hours).
# The dump is restored into a throwaway PostgreSQL 18 and its row counts are compared with production, then it is
# encrypted to .github/backup/backup-cert.pem. Only the owner's private key opens it, so keeping it as an artifact
# of this public repository is safe. Restore steps: docs/operations.md, "Backup and restore".
name: Backup

on:
  schedule:
    - cron: "47 4 1 * *" # 1st of each month, away from the ingest schedule
  workflow_dispatch:

permissions:
  contents: read

# Shares the ingest group: an import committing between the dump and the count check would make the row counts
# differ, so backup and ingest never run at the same time.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      RESTORE_URL: postgresql://postgres:postgres@localhost:5432/restore_check
    steps:
      # Logs of a public repository are public; see ingest.yml.
      - name: Mask database host
        run: node -e 'try { const h = new URL(process.env.DIRECT_DATABASE_URL).hostname; console.log(`::add-mask::${h}`); console.log(`::add-mask::${h.split(".")[0]}`); } catch {}'
      - uses: actions/checkout@v7
      - name: Dump with a PostgreSQL 18 client
        run: |
          docker run --rm -e DIRECT_DATABASE_URL postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DIRECT_DATABASE_URL"' > backup.dump
          test "$(head -c 5 backup.dump)" = "PGDMP"
          ls -l backup.dump
      - name: Restore into a throwaway database and compare row counts
        run: |
          docker run --rm --network host -v "$PWD:/work" -e RESTORE_URL postgres:18 sh -c 'pg_restore --no-owner --no-privileges --exit-on-error -d "$RESTORE_URL" /work/backup.dump'
          psql18() { docker run --rm --network host postgres:18 psql "$1" -Atc "$2"; }
          failed=0
          for table in Channel Title Broadcast BroadcastRevision Slot SlotMembership SlotSeason ImportRun CoverageWindow; do
            source=$(psql18 "$DIRECT_DATABASE_URL" "SELECT count(*) FROM \"$table\"")
            restored=$(psql18 "$RESTORE_URL" "SELECT count(*) FROM \"$table\"")
            echo "$table: production $source, restored $restored"
            [ "$source" = "$restored" ] || failed=1
          done
          [ "$failed" = 0 ] || { echo "::error::row counts differ (an ingest run may have overlapped; re-run)"; exit 1; }
      - name: Encrypt for the owner's key
        run: |
          name="anime-airtime-tracker-$(date -u +%Y-%m-%d).dump.cms"
          openssl cms -encrypt -binary -aes256 -in backup.dump -outform DER -out "$name" .github/backup/backup-cert.pem
          rm backup.dump
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          compression-level: 0
