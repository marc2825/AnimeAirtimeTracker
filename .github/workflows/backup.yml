# Monthly database backup kept outside Neon (Neon Free only restores the last 6 hours).
# The dump is restored into a throwaway PostgreSQL 18 and the row count of every table is compared with production.
# It is then encrypted to .github/backup/backup-cert.pem. Only the owner's private key opens it, so keeping it as an
# artifact of this public repository is safe. Restore steps: docs/operations.md, "Backup and restore".
name: Backup

on:
  schedule:
    - cron: "47 4 1 * *" # 1st of each month, away from the ingest schedule
  workflow_dispatch:

permissions:
  contents: read

# Shares the ingest group: an import committing between the dump and the count check would make the row counts
# differ, so backup and ingest never run at the same time.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # Pinned by digest: this job handles the owner-role URL. Update the digest when testing restores
        # (docs/operations.md → Backup and restore); Dependabot does not update images in workflow files.
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      RESTORE_URL: postgresql://postgres:postgres@localhost:5432/restore_check
      PG_IMAGE: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    steps:
      # Logs of a public repository are public; see ingest.yml.
      - name: Mask database host
        run: node -e 'try { const h = new URL(process.env.DIRECT_DATABASE_URL).hostname; console.log(`::add-mask::${h}`); console.log(`::add-mask::${h.split(".")[0]}`); } catch {}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; keep the token out of .git/config.
          persist-credentials: false
      - name: Dump with a PostgreSQL 18 client
        run: |
          docker run --rm -e DIRECT_DATABASE_URL "$PG_IMAGE" sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DIRECT_DATABASE_URL"' > backup.dump
          test "$(head -c 5 backup.dump)" = "PGDMP"
          ls -l backup.dump
      - name: Restore into a throwaway database and compare every table
        run: |
          docker run --rm --network host -v "$PWD:/work" -e RESTORE_URL "$PG_IMAGE" sh -c 'pg_restore --no-owner --no-privileges --exit-on-error -d "$RESTORE_URL" /work/backup.dump'
          # The URL is passed by name through the environment, never as a command-line argument; so is the query.
          psql18() { docker run --rm --network host -e "$1" -e SQL="$2" "$PG_IMAGE" sh -c "psql \"\$$1\" -Atc \"\$SQL\""; }
          # The tables come from the database itself, not a list kept here, so a table added by a later migration is
          # checked too (a fixed list once left out TitleSubtitle). _prisma_migrations is included: the restored copy
          # must know which migrations it has.
          list="SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename COLLATE \"C\""
          tables=$(psql18 DIRECT_DATABASE_URL "$list")
          restored_tables=$(psql18 RESTORE_URL "$list")
          [ -n "$tables" ] || { echo "::error::no tables found in production"; exit 1; }
          failed=0
          if [ "$tables" != "$restored_tables" ]; then
            echo "::error::the restored database has different tables"
            diff <(echo "$tables") <(echo "$restored_tables") || true
            failed=1
          fi
          for table in $tables; do
            source=$(psql18 DIRECT_DATABASE_URL "SELECT count(*) FROM \"$table\"")
            restored=$(psql18 RESTORE_URL "SELECT count(*) FROM \"$table\"")
            echo "$table: production $source, restored $restored"
            [ "$source" = "$restored" ] || failed=1
          done
          echo "$(echo "$tables" | wc -l) tables compared"
          [ "$failed" = 0 ] || { echo "::error::the restored copy differs (an ingest run may have overlapped; re-run)"; exit 1; }
      - name: Encrypt for the owner's key
        run: |
          name="anime-airtime-tracker-$(date -u +%Y-%m-%d).dump.cms"
          openssl cms -encrypt -binary -aes256 -in backup.dump -outform DER -out "$name" .github/backup/backup-cert.pem
          rm backup.dump
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          compression-level: 0
