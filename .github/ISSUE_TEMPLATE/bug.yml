name: 不具合
description: 表示が崩れる、エラーになる、操作できないなど
body:
  - type: input
    id: url
    attributes:
      label: ページのURL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 起きたことと再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
  - type: input
    id: environment
    attributes:
      label: 端末・ブラウザ
      placeholder: iPhone / Safari、Windows / Chrome など
