name: 不具合
description: 表示が崩れる、エラーになる、操作できないなど
body:
  - type: markdown
    attributes:
      value: Issue は誰でも読めます。氏名・メールアドレス・住所などの個人情報は書かないでください。公開したくない内容は、新規作成画面の「セキュリティ上の問題・非公開の連絡」から非公開で送れます。
  - type: input
    id: url
    attributes:
      label: ページのURL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 起きたことと再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
  - type: input
    id: environment
    attributes:
      label: 端末・ブラウザ
      placeholder: iPhone / Safari、Windows / Chrome など
